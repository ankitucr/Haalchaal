<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- user-scalable=no aur maximum-scale=1.0 screen ko fix rakhenge, zoom nahi hone denge -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haal Chaal - Secure Messaging</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary-green: #29a37e; /* Haal Chaal Theme Green */
            --light-green: #eaf6f2;
            --bg-main: #ffffff;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --border-light: #f3f4f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            /* 100dvh mobile ke browser bar ko ignore karke screen par exact fit karta hai */
            height: 100dvh; 
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* Faint radial glow as seen in your splash screen */
            background: radial-gradient(circle at 50% 50%, rgba(41, 163, 126, 0.05) 0%, #ffffff 80%);
        }

        /* --- HEADER --- */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-light);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            font-size: 1.2rem;
            color: var(--primary-green);
            background: none;
            border: none;
            cursor: pointer;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-green);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.2rem;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .user-status {
            font-size: 0.75rem;
            color: var(--primary-green);
            font-weight: 500;
        }

        .header-right {
            display: flex;
            gap: 20px;
        }

        .icon-btn {
            font-size: 1.2rem;
            color: var(--primary-green);
            background: none;
            border: none;
            cursor: pointer;
        }

        /* --- CHAT AREA --- */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        /* Hide scrollbar for cleaner look */
        .chat-area::-webkit-scrollbar { display: none; }

        .encryption-notice {
            text-align: center;
            background: var(--light-green);
            color: var(--primary-green);
            font-size: 0.7rem;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 0 auto 10px;
            max-width: 90%;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
        }

        .message.received {
            align-self: flex-start;
        }

        .message.sent {
            align-self: flex-end;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .received .bubble {
            background: #f3f4f6;
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
        }

        .sent .bubble {
            background: var(--primary-green);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sent .msg-time {
            justify-content: flex-end;
        }

        /* --- INPUT AREA --- */
        .input-area {
            padding: 12px 15px;
            background: white;
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: env(safe-area-inset-bottom, 12px); /* For iOS notch safety */
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f3f4f6;
            border-radius: 24px;
            padding: 8px 15px;
            gap: 10px;
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .input-wrapper input::placeholder {
            color: #9ca3af;
        }

        .action-icon {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--primary-green);
            color: white;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(41, 163, 126, 0.3);
        }

        /* --- CALL OVERLAY --- */
        .call-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: var(--bg-main);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
        }

        .call-avatar {
            width: 120px; height: 120px;
            border-radius: 50%;
            background: var(--primary-green);
            color: white; font-size: 4rem;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 0 0 15px var(--light-green);
        }

        .call-controls {
            position: absolute;
            bottom: 60px;
            display: flex;
            gap: 30px;
        }

        .call-btn {
            width: 65px; height: 65px;
            border-radius: 50%; border: none;
            font-size: 1.5rem; color: white; display: flex;
            justify-content: center; align-items: center;
        }

        .btn-end { background: #ef4444; }
        .btn-mic { background: #f3f4f6; color: var(--text-dark); }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="chat-header">
        <div class="header-left">
            <button class="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="profile-pic"><i class="fa-solid fa-user-tie"></i></div>
            <div class="user-info">
                <span class="user-name">Shiva Jaiswal</span>
                <span class="user-status">Online</span>
            </div>
        </div>
        <div class="header-right">
            <button class="icon-btn" onclick="showCall()"><i class="fa-solid fa-phone"></i></button>
            <button class="icon-btn"><i class="fa-solid fa-video"></i></button>
            <button class="icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
        <div class="encryption-notice">
            <i class="fa-solid fa-lock"></i> Messages are E2E encrypted.
        </div>

        <div class="message received">
            <div class="bubble">Backend structure kaisa chal raha hai? Oracle par shift karna hai?</div>
            <div class="msg-time">10:40 AM</div>
        </div>

        <div class="message sent">
            <div class="bubble">Abhi EC2 par STUN/TURN (Coturn) configure kar diya hai. Low internet par bhi call nahi kategi ab! 🔥</div>
            <div class="msg-time">10:42 AM <i class="fa-solid fa-check-double" style="color: var(--primary-green);"></i></div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <i class="fa-solid fa-plus action-icon" style="color: var(--primary-green);"></i>
        <div class="input-wrapper">
            <input type="text" id="msgInput" placeholder="Message">
            <i class="fa-regular fa-face-smile action-icon"></i>
            <i class="fa-solid fa-paperclip action-icon"></i>
        </div>
        <button class="send-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <!-- Call Overlay -->
    <div class="call-overlay" id="callScreen">
        <h2 style="color: var(--text-dark); font-weight: 600; margin-bottom: 5px;">Shiva Jaiswal</h2>
        <p style="color: var(--primary-green); margin-bottom: 50px;">Calling...</p>
        <div class="call-avatar"><i class="fa-solid fa-user-tie"></i></div>
        
        <div class="call-controls">
            <button class="call-btn btn-mic"><i class="fa-solid fa-microphone-lines-slash"></i></button>
            <button class="call-btn btn-end" onclick="hideCall()"><i class="fa-solid fa-phone-slash"></i></button>
            <button class="call-btn btn-mic"><i class="fa-solid fa-volume-high"></i></button>
        </div>
    </div>

    <script>
        // Smooth scrolling aur auto-scroll to bottom
        const chatArea = document.getElementById('chatArea');
        const msgInput = document.getElementById('msgInput');
        
        function sendMsg() {
            if(msgInput.value.trim() === '') return;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const html = `
                <div class="message sent">
                    <div class="bubble">${msgInput.value}</div>
                    <div class="msg-time">${time} <i class="fa-solid fa-check" style="color: #9ca3af;"></i></div>
                </div>`;
            chatArea.insertAdjacentHTML('beforeend', html);
            msgInput.value = '';
            chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
        }

        // Call UI Toggle
        function showCall() { document.getElementById('callScreen').style.display = 'flex'; }
        function hideCall() { document.getElementById('callScreen').style.display = 'none'; }
    </script>
</body>
</html>
